{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "load",
    "namespace": "@@NS@@",
    "annotations": {
      "platform.riscv.io/allow-scaling": "load"
    }
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "load"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "load"
        }
      },
      "spec": {
        "nodeSelector": {
          "kubernetes.io/hostname": "@@NODE_HOSTNAME@@"
        },
        "automountServiceAccountToken": false,
        "containers": [
          {
            "name": "workload",
            "image": "@@WORKLOAD_IMAGE@@",
            "imagePullPolicy": "Never",
            "command": [
              "/bin/rv-test-workload"
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "256Mi"
              }
            },
            "args": [
              "serve"
            ],
            "readinessProbe": {
              "httpGet": {
                "path": "/health",
                "port": 8080
              },
              "initialDelaySeconds": 1,
              "periodSeconds": 2
            }
          }
        ],
        "securityContext": {
          "runAsUser": 65534,
          "runAsGroup": 65534
        }
      }
    }
  }
}
