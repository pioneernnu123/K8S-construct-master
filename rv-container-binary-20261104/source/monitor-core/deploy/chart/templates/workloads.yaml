apiVersion: apps/v1
kind: Deployment
metadata:
  name: rv-prometheus
spec:
  replicas: 1
  selector:
    matchLabels: {app: rv-prometheus}
  template:
    metadata:
      labels: {app: rv-prometheus}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
{{ with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{ end }}
      securityContext: {runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534}
      containers:
      - name: monitor-core
        image: {{ required "set prometheusImage to your rv-monitor-core linux/riscv64 image" .Values.prometheusImage | quote }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["/bin/rv-monitor-core"]
        args: ["--config.file=/etc/prometheus/monitor.json", "--web.listen-address=:9090"]
        ports: [{name: http, containerPort: 9090}]
        readinessProbe: {httpGet: {path: /-/ready, port: http}}
        resources:
          requests: {cpu: "250m", memory: 256Mi}
          limits: {cpu: "2", memory: 2Gi}
        volumeMounts:
        - {name: config, mountPath: /etc/prometheus}
      volumes:
      - name: config
        configMap: {name: rv-prometheus-config}
---
apiVersion: v1
kind: Service
metadata: {name: rv-prometheus}
spec:
  type: {{ .Values.service.type }}
  selector: {app: rv-prometheus}
  ports:
  - name: http
    port: 9090
    targetPort: http
{{ if eq .Values.service.type "NodePort" }}
    nodePort: {{ .Values.service.prometheusNodePort }}
{{ end }}
